[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="freshtrack-shelflife"
version="0.1.0"
description="Estimates remaining shelf life from product class, temperature exposure, humidity, initial moisture, packaging"
requires-python=">=3.9"
dependencies=["numpy==2.0.2","scikit-learn==1.6.1"]
[project.optional-dependencies]
test=["pytest==8.4.2"]
[tool.pytest.ini_options]
testpaths=["tests"]
